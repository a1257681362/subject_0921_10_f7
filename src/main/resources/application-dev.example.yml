spring:
  datasource:
    url: jdbc:h2:file:./data/evops;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

mybatis-plus:
  global-config:
    db-config:
      id-type: auto

# 证书验真窗口小流量限流（次/分钟/IP）；0 或负数表示不限流
evops:
  cert:
    verify:
      rate-limit-per-minute: 30
