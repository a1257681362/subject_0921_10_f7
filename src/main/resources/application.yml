server:
  port: 8080

spring:
  autoconfigure:
    exclude: org.apache.shiro.spring.boot.autoconfigure.ShiroAnnotationProcessorAutoConfiguration
  application:
    name: evops-base
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:h2:file:./data/evops;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.evops
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.evops: INFO

# 证书验真对外窗口：用人单位先小流量接入。按来源 IP 滑动窗口限流，默认每分钟 30 次；
# 放量时调大；设为 0 或负数表示不限流（仅建议内网压测临时使用）。
evops:
  cert:
    verify:
      rate-limit-per-minute: 30
